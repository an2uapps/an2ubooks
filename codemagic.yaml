# Cloud build recipe for Codemagic (codemagic.io). Nothing needs to be installed on your computer.
workflows:
  android-release:
    name: AN2U Books - Android (Google Play)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      groups:
        - an2u_signing           # secure variables: AN2U_KEYSTORE_BASE64, AN2U_KEYSTORE_PASSWORD, AN2U_KEY_ALIAS, AN2U_KEY_PASSWORD
      node: 22
      java: 21
    scripts:
      - name: Install and add the Android project
        script: |
          npm install
          npx cap add android
          npm run assets
          npx cap sync android
      - name: Add signing and version number
        script: |
          echo "$AN2U_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          python3 scripts/patch-android.py
      - name: Build the Play Store bundle (AAB) and a test APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

  ios-release:
    name: AN2U Books - iPhone (App Store / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AN2U Codemagic key   # the App Store Connect API key you add in Codemagic, with this name
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.an2u.books
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install and add the iPhone project
        script: |
          npm install
          npx cap add ios
          npm run assets
          npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build the IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
